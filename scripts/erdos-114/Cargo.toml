[package]
name = "ehp_n3_poc"
version = "2.0.0"
edition = "2021"
description = "EHP Conjecture n=3 Rigorous Verification — IEEE 1788 Interval Arithmetic"
authors = ["Kenneth A. Mendoza <kenmendoza@me.com>"]

[dependencies]
inari = "2.0"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha256 = "1"

[[bin]]
name = "ehp_n3_poc"
path = "src/main.rs"

